name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Base Stats
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: output
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          config_theme: dark
          extras_css: |
            svg { background-color: #1a1b26 !important; }
            h1, h2, h3 { color: #2196F3 !important; }

      - name: Achievements
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics-achievements.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: output
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
          config_theme: dark
          extras_css: |
            svg { background-color: #1a1b26 !important; }
            h1, h2, h3 { color: #2196F3 !important; }

      - name: Top Languages
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics-languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: output
          base: ""
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_limit: 8
          config_theme: dark
          extras_css: |
            svg { background-color: #1a1b26 !important; }
            h1, h2, h3 { color: #2196F3 !important; }
